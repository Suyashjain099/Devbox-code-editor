version: '3.8'

services:
  # Coding execution server (runs inside Docker with all compilers)
  coding-server:
    build:
      context: ./coding-server
      dockerfile: Dockerfile
    container_name: devbox-coding-server
    ports:
      - "9000:9000"
    volumes:
      - coding-data:/app/user
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      - NODE_ENV=production

  # Auth server (MongoDB + JWT)
  auth-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: devbox-auth-server
    ports:
      - "5000:5000"
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - PORT=5000

volumes:
  coding-data:
