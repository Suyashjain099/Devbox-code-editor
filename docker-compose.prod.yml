services:
  mongo:
    image: mongo:7
    container_name: devbox-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand({ ping: 1 }).ok\" mongodb://localhost:27017/admin | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Coding execution server (runs inside Docker with all compilers)
  coding-server:
    build:
      context: ./coding-server
      dockerfile: Dockerfile
    container_name: devbox-coding-server
    ports:
      - "9000:9000"
    volumes:
      - coding-data:/app/user
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      - NODE_ENV=production

  # Auth server (MongoDB + JWT)
  auth-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: devbox-auth-server
    ports:
      - "5000:5000"
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
    dns:
      - 8.8.8.8
      - 8.8.4.4

  # Landing/Dashboard Website frontend
  website-frontend:
    build:
      context: ./Website-frontend
      dockerfile: Dockerfile
    container_name: devbox-website-frontend
    ports:
      - "3000:80"
    restart: unless-stopped

  # Code Editor frontend
  editor-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devbox-editor-frontend
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  mongo-data:
  coding-data:
